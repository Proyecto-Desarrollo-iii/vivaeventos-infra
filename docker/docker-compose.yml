services:
# Para cada servicio, se define su imagen, puertos, variables de entorno y dependencias.
  postgres:
    image: postgres:16-alpine
    container_name: vivaeventos-postgres
    environment:
      POSTGRES_USER: devdb
      POSTGRES_PASSWORD: a1b2c3d4
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth:
    build:
      context: ../../vivaeventos-auth
      dockerfile: Dockerfile
    container_name: vivaeventos-auth
    ports:
      - "8088:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/vivaeventos_auth
      SPRING_DATASOURCE_USERNAME: devdb
      SPRING_DATASOURCE_PASSWORD: a1b2c3d4
      JWT_SECRET: dGhpc0lzQVZlcnlTZWNyZXRLZXlGb3JWYWlhRXZlbnRvc1RoYXROZWVkczUw
    depends_on:
      postgres:
        condition: service_healthy

  gateway:
    build:
      context: ../../vivaeventos-gateway
      dockerfile: Dockerfile
    container_name: vivaeventos-gateway
    ports:
      - "8090:8080"
    environment:
      JWT_SECRET: dGhpc0lzQVZlcnlTZWNyZXRLZXlGb3JWYWlhRXZlbnRvc1RoYXROZWVkczUw
      AUTH_URI: http://auth:8083
      EVENTS_URI: http://events:8081
      TICKETS_URI: http://tickets:8085
      ORDERS_URI: http://orders:8083
      PAYMENTS_URI: http://payments:8084
      CHECKIN_URI: http://checkin:8086
      NOTIFICATIONS_URI: http://notifications:8087
      ANALYTICS_URI: http://analytics:8088
      AUDIT_URI: http://audit:8089
    depends_on:
      - auth

  events:
    build:
      context: ../../vivaeventos-events
      dockerfile: Dockerfile
    container_name: vivaeventos-events
    ports:
      - "8094:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/vivaeventos_events
      SPRING_DATASOURCE_USERNAME: devdb
      SPRING_DATASOURCE_PASSWORD: a1b2c3d4
      JWT_SECRET: dGhpc0lzQVZlcnlTZWNyZXRLZXlGb3JWYWlhRXZlbnRvc1RoYXROZWVkczUw
      SERVICES_TICKETS_URL: http://tickets:8085
      SERVICES_NOTIFICATIONS_URL: http://notifications:8087
    depends_on:
      postgres:
        condition: service_healthy

  tickets:
    build:
      context: ../../vivaeventos-tickets
      dockerfile: Dockerfile
    container_name: vivaeventos-tickets
    ports:
      - "8095:8085"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/vivaeventos_tickets
      SPRING_DATASOURCE_USERNAME: devdb
      SPRING_DATASOURCE_PASSWORD: a1b2c3d4
      JWT_SECRET: dGhpc0lzQVZlcnlTZWNyZXRLZXlGb3JWYWlhRXZlbnRvc1RoYXROZWVkczUw
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8086/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy

  orders:
    build:
      context: ../../vivaeventos-orders
      dockerfile: Dockerfile
    container_name: vivaeventos-orders
    ports:
      - "8097:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/vivaeventos_orders
      SPRING_DATASOURCE_USERNAME: devdb
      SPRING_DATASOURCE_PASSWORD: a1b2c3d4
      JWT_SECRET: dGhpc0lzQVZlcnlTZWNyZXRLZXlGb3JWYWlhRXZlbnRvc1RoYXROZWVkczUw
    depends_on:
      postgres:
        condition: service_healthy

  payments:
    build:
      context: ../../vivaeventos-payments
      dockerfile: Dockerfile
    container_name: vivaeventos-payments
    ports:
      - "8096:8084"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/vivaeventos_payments
      SPRING_DATASOURCE_USERNAME: devdb
      SPRING_DATASOURCE_PASSWORD: a1b2c3d4
      JWT_SECRET: dGhpc0lzQVZlcnlTZWNyZXRLZXlGb3JWYWlhRXZlbnRvc1RoYXROZWVkczUw
      STRIPE_API_KEY: sk_test_51TXTrGJ2Lp92DHPeUZQVB73EFdSfoDXjtMIrToHpNESQqbZe9WYe9gO5aPdst5DTZ0Tc9Pkc7kbslyik1ELBaT8r00WDAmnfet
      STRIPE_WEBHOOK_SECRET: whsec_fb27781edd9ec8bf270c3664a7a4481fd6c1e36b402c16e2910600bae758c1a
      ORDERS_SERVICE_URL: http://orders:8083
      TICKETS_SERVICE_URL: http://tickets:8085
      SERVICES_NOTIFICATIONS_URL: http://notifications:8087
      SERVICES_EVENTS_URL: http://events:8081
      PAYMENT_TIMEOUT_MINUTES: 15
      MANAGEMENT_SERVER_PORT: 8087
    depends_on:
      postgres:
        condition: service_healthy

  checkin:
    build:
      context: ../../vivaeventos-checkin
      dockerfile: Dockerfile
    container_name: vivaeventos-checkin
    ports:
      - "8091:8086"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/vivaeventos_checkin
      SPRING_DATASOURCE_USERNAME: devdb
      SPRING_DATASOURCE_PASSWORD: a1b2c3d4
      JWT_SECRET: dGhpc0lzQVZlcnlTZWNyZXRLZXlGb3JWYWlhRXZlbnRvc1RoYXROZWVkczUw
      TICKETS_SERVICE_URL: http://tickets:8085
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8087/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      tickets:
        condition: service_healthy

  notifications:
    build:
      context: ../../vivaeventos-notifications
      dockerfile: Dockerfile
    container_name: vivaeventos-notifications
    ports:
      - "8098:8087"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/vivaeventos_notifications
      SPRING_DATASOURCE_USERNAME: devdb
      SPRING_DATASOURCE_PASSWORD: a1b2c3d4
      JWT_SECRET: dGhpc0lzQVZlcnlTZWNyZXRLZXlGb3JWYWlhRXZlbnRvc1RoYXROZWVkczUw
      SERVER_PORT: 8087
      SERVICES_EVENTS_URL: http://events:8081
      SERVICES_TICKETS_URL: http://tickets:8085
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
