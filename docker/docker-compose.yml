services:
  postgres:
    image: postgres:16-alpine
    container_name: vivaeventos-postgres
    environment:
      POSTGRES_USER: devdb
      POSTGRES_PASSWORD: a1b2c3d4
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devdb"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: